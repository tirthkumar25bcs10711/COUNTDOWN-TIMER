<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="timer-box">
        
        <h2 class="title">COUNTDOWN TIMER</h2>
        
        <div class="display-area">
            <h1 id="display">00:00</h1>
        </div>

        <div class="input-area" id="inputArea">
            <div class="input-wrapper">
                <input type="number" id="minInput" placeholder="00" min="0">
                <span class="label">MIN</span>
            </div>
            <span class="colon">:</span>
            <div class="input-wrapper">
                <input type="number" id="secInput" placeholder="00" min="0">
                <span class="label">SEC</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-black">Start Timer</button>
            <button id="pauseBtn" class="btn-outline hidden">Pause</button>

            <div id="pausedControls" class="btn-group hidden">
                <button id="resumeBtn" class="btn-black">Resume</button>
                <button id="cancelBtn" class="btn-outline">Cancel</button>
            </div>

            <button id="stopBeepBtn" class="btn-red hidden">Stop Alarm</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
